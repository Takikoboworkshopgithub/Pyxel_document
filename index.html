<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pythonで始める、ゲーム制作</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --bg-main: #0d2f62;
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      --primary: #3ea8ff;
      --primary-hover: #60a5fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Helvetica Neue",
        Arial,
        sans-serif;

      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.6;

      min-height: 100vh;

      display: flex;
      flex-direction: column;

      padding: 40px 16px 0;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;

      flex: 1;
    }


    /* =========================
       本の概要
    ========================= */

    .book-header {
      display: flex;
      gap: 32px;

      margin-bottom: 55px;
    }

    .book-cover {
      width: 140px;
      height: 196px;

      flex-shrink: 0;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .book-cover img {
      display: block;

      width: 130px;
      height: auto;

      margin-top: 40px;

      border-radius: 8px;
    }

    .book-details {
      flex: 1;

      display: flex;
      flex-direction: column;
    }

    .book-title {
      margin-bottom: 12px;

      color: var(--text-main);

      font-size: 28px;
      font-weight: 800;
      line-height: 1.5;
      letter-spacing: -0.01em;
    }

    .book-description {
      margin-bottom: 8px;

      color: var(--text-sub);

      font-size: 13px;
      line-height: 1.8;
    }


    /* =========================
       リンク
    ========================= */

    .author-info {
      margin-top: 0;
    }

    .author-link {
      display: inline-flex;
      align-items: center;

      color: var(--primary);

      font-size: 12px;

      text-decoration: none;

      transition: color 0.15s ease;
    }

    .author-link:hover {
      color: var(--primary-hover);
      text-decoration: underline;
    }


    /* =========================
       Chapters
    ========================= */

    .chapters-section {
      padding: 0 4px;
    }

    .chapters-header {
      display: flex;
      align-items: center;

      margin-bottom: 28px;

      color: var(--text-main);

      font-size: 30px;
      font-weight: 700;
    }


    /* =========================
       Chapter Timeline
    ========================= */

    .chapter-list {
      position: relative;

      display: flex;
      flex-direction: column;
    }

    .chapter {
      position: relative;

      display: block;

      min-height: 88px;

      padding: 0 8px 28px 42px;

      color: var(--text-main);

      text-decoration: none;
    }


    /* =========================
       Chapterをつなぐ点線
    ========================= */

    .chapter:not(:last-child)::before {
      content: "";

      position: absolute;

      left: 14px;
      top: 14px;
      bottom: 0;

      width: 0;

      border-left: 2px dotted var(--primary);

      opacity: 0.7;

      z-index: 1;
    }


    /* =========================
       Chapterの丸
    ========================= */

    .chapter::after {
      content: "";

      position: absolute;

      left: 7px;
      top: 0;

      width: 14px;
      height: 14px;

      border-radius: 50%;

      background-color: var(--bg-main);

      border: 3px solid var(--primary);

      z-index: 2;
    }


    /* =========================
       Chapter番号
    ========================= */

    .chapter-number {
      display: block;

      margin-bottom: 2px;

      color: var(--primary);

      font-size: 12px;
      font-weight: 700;

      letter-spacing: 0.02em;
    }


    /* =========================
       Chapterタイトル
    ========================= */

    .chapter-title {
      display: block;

      color: var(--text-main);

      font-size: 17px;
      font-weight: 600;

      line-height: 1.5;

      transition: color 0.15s ease;
    }

    .chapter:hover .chapter-title {
      color: var(--primary);
    }


    /* =========================
       Footer
    ========================= */

    .site-footer {
      width: 100%;

      margin-top: auto;
      padding: 40px 16px;

      border-top: 1px solid rgba(148, 163, 184, 0.2);

      background-color: #0f172a;

      text-align: center;

      color: #64748b;

      font-size: 13px;
      font-weight: 700;
    }


    /* =========================
       スマートフォン
    ========================= */

    @media (max-width: 640px) {

      body {
        padding-top: 24px;
      }

      .book-header {
        flex-direction: column;

        gap: 20px;

        margin-bottom: 45px;
      }

      .book-cover {
        order: 2;
      }

      .book-details {
        order: 1;
      }

      .book-cover img {
        margin-top: 10px;
      }
    }


    @media (max-width: 480px) {

      .book-title {
        font-size: 25px;
      }

      .chapters-header {
        font-size: 26px;
      }

      .chapter {
        min-height: 82px;

        padding-left: 38px;
      }

      .chapter-title {
        font-size: 16px;
      }

      .chapter::after {
        left: 5px;
      }

      .chapter:not(:last-child)::before {
        left: 12px;
      }
    }
  </style>
</head>


<body>

          alt="Pyxel"

      </div>


      <div class="book-details">

        <div class="author-info">

          </a>

        </div>

      </div>

    </div>


    <!-- =========================
         Chapter一覧
    ========================= -->

    <section class="chapters-section">

      <div class="chapters-header">
        Chapters
      </div>


      <div class="chapter-list">

        <a class="chapter" href="01/index.html">

          </span>

          <span class="chapter-title">

          </span>
        </a>


        <a class="chapter" href="02/index.html">

        <a class="chapter" href="03/index.html">
          <span class="chapter-number">

          </span>

          <span class="chapter-title">

          </span>

        <a class="chapter" href="04/index.html">

          </span>

          <span class="chapter-title">

          </span>
        </a>


        <a class="chapter" href="05/index.html">
          <span class="chapter-number">

          </span>

          <span class="chapter-title">

          </span>
        </a>


        <a class="chapter" href="06/index.html">

            Chapter 06

          <span class="chapter-title">

        </a>

      </div>

    </section>

  </div>


  <!-- =========================
       Footer
  ========================= -->

  <footer class="site-footer">
    <div>
      IQ Python Workshop 2026 - Rep. Takiguchi
    </div>
  </footer>


</body>
</html>
